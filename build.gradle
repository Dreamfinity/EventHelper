buildscript {
    ext.kotlin_version = '1.7.10'
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://files.minecraftforge.net/maven"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
    }
    dependencies {
        classpath('com.anatawa12.forge:ForgeGradle:1.2-1.0.+') {
            changing = true
        }
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'forge'
apply plugin: 'java'
apply plugin: 'kotlin'

repositories {
    flatDir {
        dirs 'lib'
    }
}


[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

version = mod_version
group = mod_group
archivesBaseName = mod_archives_name

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "idea"
    replace "@VERSION@", project.version
    replace 'BuildController.internalDummyBuildState()', isDummyBuild
}

dependencies {
    implementation name: 'bukkit-1.7.10'
    implementation name: 'worldedit-6.1'
    implementation name: 'worldguard-6.1'
    implementation name: 'GriefPreventionPlus-13.3'
}

processResources {

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version,
                'mod_id': mod_id,
                'mod_name': mod_name,
                'mod_author': mod_author,
                'mod_description': mod_description,
                'isDummyBuild': isDummyBuild,
                'mc_version': mc_version,
                'mod_version': mod_version,
                'mod_icon': mod_icon
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

task devJar(type: Jar) {
    if (isDummyBuild.toBoolean()) {
        classifier = 'dummydev'
    } else {
        classifier = 'dev'
    }

    from sourceSets.main.output
}

jar {
    doFirst {
        if (isDummyBuild.toBoolean()) {
            classifier = 'dummyorigin'
        } else {
            classifier = 'origin'
        }
    }
}

task sourcesJar(type: Jar) {
    classifier = 'sources'
    from sourceSets.main.allSource
}

task buildDummy(type: GradleBuild) {
    tasks = ['build']
    startParameter.projectProperties = ['isDummyBuild': 'true']
}

task buildAll() {}

buildAll.dependsOn('build')
buildAll.finalizedBy('buildDummy')


artifacts {
    archives devJar

    if (!isDummyBuild.toBoolean()) {
        archives sourcesJar
    }
}